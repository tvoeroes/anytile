<!DOCTYPE html>
<html lang="en-US">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Anytile</title>
	<link rel="icon" href="favicon.ico" />

	<style>
		body {
			margin: 0;
		}

		#view {
			width: 100%;
			height: 100%;
		}

		#requests {
			width: 24rem;
		}

		#ui {
			position: absolute;
			display: inline-block;
			background-color: white;
			padding: 0.5rem;
			margin: 0.5rem;
			border-radius: 0.25rem;
			line-height: 1.5rem;
			border-style: solid;
			border-width: 0.0625rem;
		}

		#view {
			position: absolute;
		}
	</style>

	<script type="module" src="index.ts"></script>
</head>

<body>
	<div>
		<canvas id="view" tabindex="0"></canvas> <!-- NOTE: tabindex="0" makes key events work on canvas -->
		<div id="ui">
			<label>
				Requests = <progress id="requests" value="0"></progress>
			</label>
			<br />
			<label>
				Z = <input id="z" type="number" value="0" step="1" min="0" max="31" />
			</label>
			<label>
				S = <input id="s" type="number" value="256" step="1" min="1" max="2048" />
			</label>
			<br />
			<label>
				URL Template = <input id="url" type="text" size="48" />
			</label>
			<br />
			<span><a href="https://github.com/tvoeroes/anytile">Source</a></span>
		</div>
	</div>
</body>

</html>
